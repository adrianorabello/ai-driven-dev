server:
  port: 8080

spring:
  application:
    name: Order Management System
  datasource:
    url: jdbc:h2:mem:orderdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Secret should be in env var in prod
    secret: 9a4f2c8d3b7a1e6f45c8a0b3c2d1e9f8g7h6i5j4k3l2m1n0o9p8q7r6s5t4u3v2
    expiration-milliseconds: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
